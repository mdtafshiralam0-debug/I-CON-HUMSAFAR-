name: Build I CON Humsafar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5 --no-configuration-cache

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ICON-Humsafar-App
        path: app/build/outputs/apk/debug/app-debug.apk
